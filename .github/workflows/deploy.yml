name: Auto Deploy LLM Gateway

on:
  push:
    branches: [ master ]
    paths:
      - 'gateway/**'
      - 'pyproject.toml'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to LAS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Gateway Deploy: $(date) ==="
            cd /opt/autopublish/llm-gateway
            git fetch origin
            git reset --hard origin/master
            cd /opt/autopublish
            docker-compose -f deploy/docker-compose.yml up -d --build llm-gateway
            echo "=== Gateway Deploy Done ==="
