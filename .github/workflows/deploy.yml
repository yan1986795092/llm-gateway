name: Auto Deploy LLM Gateway

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Gateway
        working-directory: /opt/autopublish
        run: |
          echo "=== Gateway Deploy: $(date) ==="
          set -e
          cd /opt/autopublish/llm-gateway
          git fetch origin
          git reset --hard origin/master
          cd /opt/autopublish
          docker-compose -f deploy/docker-compose.yml up -d --build llm-gateway
          echo "=== Gateway Deploy Done ==="
