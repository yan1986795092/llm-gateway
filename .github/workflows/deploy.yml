name: Auto Deploy LLM Gateway

# 推送 master 触发 / 也可手动触发
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署到服务器（拉代码 + 重建镜像）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            # 1) 服务器网关目录，与云端对齐
            cd /root/llm-gateway
            git fetch origin
            git reset --hard origin/master
            # 2) 用生产 compose 重建并重启网关容器
            docker compose -f docker-compose.prod.yml up -d --build llm-gateway
            # 3) 校验存活
            docker ps | grep mes-gateway && echo "gateway deployed OK"