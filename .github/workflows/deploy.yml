name: Auto Deploy LLM Gateway

# 推送 master 触发 / 也可手动触发
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署到服务器（拉代码 + 重建镜像）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            # 1) 与云端对齐代码
            cd /opt/autopublish/llm-gateway
            git fetch origin
            git reset --hard origin/master
            # 2) 回到 compose 根目录，重建并重启网关
            cd /opt/autopublish
            docker compose -f deploy/docker-compose.yml up -d --build llm-gateway
            # 3) 校验存活
            docker ps | grep llm-gateway && echo "llm-gateway deployed OK"